name: CI
on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Disposable server for destructive delivery tests; never DB_EVENTS_URL.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: events_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U events_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EVENTS_TEST_PG_URL: postgres://events_test@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.9.0
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run railway:check
      - run: npm test
